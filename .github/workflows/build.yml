name: Build Radxa Zero Imager

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.9 (MinGW) + toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'mingw'
          cache: true

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        shell: bash
        run: |
          # MinGW ships with the aqt toolchain under IQTA_TOOLS.
          MINGW_BIN=$(dirname "$(find "$IQTA_TOOLS" -name g++.exe | head -1)")
          cmake -S src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQt6_ROOT="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER="$MINGW_BIN/gcc.exe" \
            -DCMAKE_CXX_COMPILER="$MINGW_BIN/g++.exe"

      - name: Build
        shell: bash
        run: |
          MINGW_BIN=$(dirname "$(find "$IQTA_TOOLS" -name g++.exe | head -1)")
          export PATH="$MINGW_BIN:$PATH"
          cmake --build build

      - name: Collect the app
        shell: bash
        run: |
          mkdir -p dist
          # build/deploy already holds radxa-zero-imager.exe + the Qt runtime.
          cp -r build/deploy/. dist/
          cd dist && zip -r ../radxa-zero-imager-windows.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: radxa-zero-imager-windows
          path: radxa-zero-imager-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: radxa-zero-imager-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
