name: 跨平台构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  checks:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.codechange.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 0. 检测代码变更（非代码变更时编译矩阵跳过）
        id: codechange
        run: |
          BASE=main
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.base_ref }}"; fi
          git fetch --no-tags origin "$BASE" 2>/dev/null || true
          if ! git rev-parse --verify "origin/$BASE" >/dev/null 2>&1; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE...HEAD" -- . \
            ':(exclude)*.md' ':(exclude)**/*.md' ':(exclude).github/**' > /tmp/changed.txt 2>/dev/null; then
            if [ -s /tmp/changed.txt ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 1. README 归属 + Apache 2.0
        run: |
          grep -q 'Raspberry Pi Imager' README.md || { echo "FAIL: missing upstream attribution"; exit 1; }
          grep -qi 'apache' README.md || { echo "FAIL: missing Apache 2.0 note"; exit 1; }
          echo OK

      - name: 2. 改动文件标注 [MODIFIED]
        run: |
          grep -q 'MODIFIED for radxa-zero-archlinux-builder' src/customization_generator.cpp || { echo FAIL; exit 1; }
          grep -q 'MODIFIED for radxa-zero-archlinux-builder' src/imagewriter.cpp || { echo FAIL; exit 1; }
          echo OK

      - name: 3. config.txt 不写明文密码
        run: |
          grep -q 'password_hash=' src/customization_generator.cpp || { echo FAIL; exit 1; }
          grep -q 'wifi_psk=' src/customization_generator.cpp || { echo FAIL; exit 1; }
          echo OK

      - name: 4. config.txt 走 radxa init_format
        run: |
          grep -q '"radxa"' src/imagewriter.cpp || { echo FAIL; exit 1; }
          grep -q 'generateRadxaConfigTxt' src/imagewriter.cpp || { echo FAIL; exit 1; }
          echo OK

      - name: 5. 无硬编码密钥（排除测试/格式串/变量）
        run: |
          if grep -rnEi 'psk\s*=\s*["'"'"'][a-zA-Z0-9][^"'"'"']{4,}|password\s*=\s*["'"'"'][a-zA-Z0-9][^"'"'"']*' --include='*.sh' --include='*.cpp' --include='*.h' . | grep -v '/test/\|your-wifi\|your-password'; then
            echo "FAIL: potential hard-coded secret"; exit 1
          fi
          echo OK

  # ============================================================
  # Windows x64 — MinGW (vendored libusb/yescrypt need GCC, not MSVC)
  # ============================================================
  win-x64:
    name: Windows x64
    needs: [checks]
    if: needs.checks.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6.9 + matching MinGW toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'mingw'
          cache: true

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure + Build
        shell: bash
        run: |
          MINGW_BIN=$(dirname "$(find "$IQTA_TOOLS" -name g++.exe | head -1)")
          export PATH="$MINGW_BIN:$PATH"
          cmake -B build -S src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQt6_ROOT="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER="$MINGW_BIN/gcc.exe" \
            -DCMAKE_CXX_COMPILER="$MINGW_BIN/g++.exe"
          cmake --build build --parallel

      - name: Deploy Qt runtime
        shell: bash
        run: |
          "$QT_ROOT_DIR/bin/windeployqt" build/radxa-zero-imager.exe --release --no-translations

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp build/radxa-zero-imager.exe dist/ 2>/dev/null || true
          cp -r build/*.dll dist/ 2>/dev/null || true
          cp -r build/platforms build/styles build/imageformats dist/ 2>/dev/null || true
          cd dist && 7z a -tzip ../radxa-zero-imager-win-x64.zip .

      - uses: actions/upload-artifact@v6
        with:
          name: radxa-zero-imager-win-x64
          path: radxa-zero-imager-win-x64.zip

  # ============================================================
  # Linux x64 (Qt6 + linuxdeploy -> AppImage)
  # ============================================================
  linux-x64:
    name: Linux x64
    needs: [checks]
    if: needs.checks.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install deps (system libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build cmake g++ \
            libgl1-mesa-dev libgnutls28-dev libudev-dev liburing-dev \
            libxkbcommon-x11-0 libxkbcommon-dev libxcb-xinerama0 libxcb-cursor0

      - name: Install Qt 6.9 (aqtinstall)
        run: |
          python3 -m pip install --upgrade pip
          pip install aqtinstall
          aqt install-qt linux desktop 6.9.2 linux_gcc_64 -O /opt/Qt

      - name: Configure + Build
        run: |
          cmake -B build -S src -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/opt/Qt/6.9.2/gcc_64
          cmake --build build --parallel

      - name: Package (AppImage)
        run: |
          export PATH="/opt/Qt/6.9.2/gcc_64/bin:$PATH"
          export QMAKE=/opt/Qt/6.9.2/gcc_64/bin/qmake
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp build/radxa-zero-imager AppDir/usr/bin/
          cat > AppDir/usr/share/applications/radxa-zero-imager.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Radxa Zero Imager
          Exec=radxa-zero-imager
          Categories=Utility;
          EOF
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable AppDir/usr/bin/radxa-zero-imager --plugin qt --output appimage
          mv Radxa_Zero_Imager*.AppImage radxa-zero-imager-linux-x86_64.AppImage 2>/dev/null || mv *.AppImage radxa-zero-imager-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v6
        with:
          name: radxa-zero-imager-linux-x64
          path: radxa-zero-imager-linux-x86_64.AppImage

  # ============================================================
  release:
    name: 发布
    needs: [checks, win-x64, linux-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: 生成校验和
        run: sha256sum radxa-zero-imager-*.zip radxa-zero-imager-*.AppImage > sums.txt 2>/dev/null || true
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Radxa Zero Imager ${{ github.ref_name }}
          files: |
            radxa-zero-imager-*.zip
            radxa-zero-imager-*.AppImage
            sums.txt
          draft: false
          make_latest: true

  ci-passed:
    name: 质量门
    needs: [checks, win-x64, linux-x64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 校验结果
        run: |
          FAIL=0
          for r in ${{ needs.checks.result }} ${{ needs.win-x64.result }} ${{ needs.linux-x64.result }}; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then FAIL=1; fi
          done
          if [ "$FAIL" = "1" ]; then echo "存在失败任务"; exit 1; fi
          echo "全部通过"
